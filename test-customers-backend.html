<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers Backend Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-result { margin: 10px 0; padding: 10px; background: #f9f9f9; border-left: 4px solid #007bff; }
        .error { border-left-color: #dc3545; background: #f8d7da; }
        .success { border-left-color: #28a745; background: #d4edda; }
        input, textarea, button { margin: 5px; padding: 8px; }
        button { background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Admin Customers Backend API Test</h1>
    
    <div class="test-section">
        <h2>1. Get All Customers</h2>
        <button onclick="testGetAllCustomers()">Load All Customers</button>
        <button onclick="testGetAllCustomers(2)">Load Page 2</button>
        <div id="allCustomersResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Search Customers</h2>
        <input type="text" id="searchInput" placeholder="Search customers..." style="width: 300px;">
        <button onclick="testSearchCustomers()">Search</button>
        <div id="searchResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Get Customer Details</h2>
        <input type="text" id="customerIdInput" placeholder="Customer ID (e.g., 1)" style="width: 200px;">
        <button onclick="testGetCustomerDetails()">Get Details</button>
        <div id="customerDetailsResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>4. Add New Customer</h2>
        <div>
            <input type="text" id="addName" placeholder="Customer Name" style="width: 200px;">
            <input type="text" id="addPhone" placeholder="Phone Number" style="width: 150px;">
            <input type="email" id="addEmail" placeholder="Email" style="width: 200px;">
        </div>
        <div>
            <textarea id="addAddress" placeholder="Address" style="width: 300px; height: 60px;"></textarea>
            <input type="date" id="addDOB" style="width: 150px;">
        </div>
        <button onclick="testAddCustomer()">Add Customer</button>
        <div id="addCustomerResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>5. Update Customer</h2>
        <div>
            <input type="text" id="updateId" placeholder="Customer ID" style="width: 150px;">
            <input type="text" id="updateName" placeholder="New Name" style="width: 200px;">
            <input type="text" id="updatePhone" placeholder="New Phone" style="width: 150px;">
        </div>
        <div>
            <input type="email" id="updateEmail" placeholder="New Email" style="width: 200px;">
            <textarea id="updateAddress" placeholder="New Address" style="width: 300px; height: 60px;"></textarea>
            <input type="date" id="updateDOB" style="width: 150px;">
        </div>
        <button onclick="testUpdateCustomer()">Update Customer</button>
        <div id="updateCustomerResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>6. Customer Statistics</h2>
        <button onclick="testGetCustomerStats()">Get Statistics</button>
        <div id="customerStatsResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>7. Customer Purchase History</h2>
        <input type="text" id="purchaseCustomerId" placeholder="Customer ID" style="width: 200px;">
        <button onclick="testGetCustomerPurchases()">Get Purchase History</button>
        <div id="purchaseHistoryResult" class="test-result"></div>
    </div>

    <script>
        const API_BASE_URL = 'php/admin-customers.php';

        function displayResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.className = `test-result ${isError ? 'error' : 'success'}`;
            
            if (typeof data === 'object') {
                element.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } else {
                element.innerHTML = data;
            }
        }

        async function testGetAllCustomers(page = 1) {
            try {
                const params = new URLSearchParams({
                    action: 'get_all_customers',
                    page: page,
                    limit: 5
                });
                
                const response = await fetch(`${API_BASE_URL}?${params}`);
                const data = await response.json();
                
                if (data.success) {
                    let html = `<h4>Customers (Page ${page}):</h4>`;
                    html += '<table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Address</th><th>Age</th><th>Purchases</th></tr>';
                    data.customers.forEach(customer => {
                        html += `<tr>
                            <td>${customer.id}</td>
                            <td>${customer.name}</td>
                            <td>${customer.phone}</td>
                            <td>${customer.address}</td>
                            <td>${customer.age || 'N/A'}</td>
                            <td>${customer.total_purchases}</td>
                        </tr>`;
                    });
                    html += '</table>';
                    html += `<p>Total: ${data.pagination.total_count} customers, Page ${data.pagination.current_page} of ${data.pagination.total_pages}</p>`;
                    displayResult('allCustomersResult', html);
                } else {
                    displayResult('allCustomersResult', data, true);
                }
                
            } catch (error) {
                displayResult('allCustomersResult', `Error: ${error.message}`, true);
            }
        }

        async function testSearchCustomers() {
            try {
                const searchTerm = document.getElementById('searchInput').value;
                const params = new URLSearchParams({
                    action: 'search_customers',
                    search: searchTerm,
                    limit: 10
                });
                
                const response = await fetch(`${API_BASE_URL}?${params}`);
                const data = await response.json();
                
                if (data.success) {
                    let html = `<h4>Search Results for "${searchTerm}":</h4>`;
                    html += '<table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Address</th><th>Purchases</th></tr>';
                    data.customers.forEach(customer => {
                        html += `<tr>
                            <td>${customer.id}</td>
                            <td>${customer.name}</td>
                            <td>${customer.phone}</td>
                            <td>${customer.address}</td>
                            <td>${customer.total_purchases}</td>
                        </tr>`;
                    });
                    html += '</table>';
                    html += `<p>Found: ${data.total_found} customers</p>`;
                    displayResult('searchResult', html);
                } else {
                    displayResult('searchResult', data, true);
                }
                
            } catch (error) {
                displayResult('searchResult', `Error: ${error.message}`, true);
            }
        }

        async function testGetCustomerDetails() {
            try {
                const customerId = document.getElementById('customerIdInput').value;
                const params = new URLSearchParams({
                    action: 'get_customer_details',
                    customer_id: customerId
                });
                
                const response = await fetch(`${API_BASE_URL}?${params}`);
                const data = await response.json();
                
                displayResult('customerDetailsResult', data, !data.success);
                
            } catch (error) {
                displayResult('customerDetailsResult', `Error: ${error.message}`, true);
            }
        }

        async function testAddCustomer() {
            try {
                const formData = new FormData();
                formData.append('action', 'add_customer');
                formData.append('name', document.getElementById('addName').value);
                formData.append('phone', document.getElementById('addPhone').value);
                formData.append('email', document.getElementById('addEmail').value);
                formData.append('address', document.getElementById('addAddress').value);
                formData.append('date_of_birth', document.getElementById('addDOB').value);
                
                const response = await fetch(API_BASE_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                displayResult('addCustomerResult', data, !data.success);
                
                if (data.success) {
                    // Clear form
                    document.getElementById('addName').value = '';
                    document.getElementById('addPhone').value = '';
                    document.getElementById('addEmail').value = '';
                    document.getElementById('addAddress').value = '';
                    document.getElementById('addDOB').value = '';
                }
                
            } catch (error) {
                displayResult('addCustomerResult', `Error: ${error.message}`, true);
            }
        }

        async function testUpdateCustomer() {
            try {
                const formData = new FormData();
                formData.append('action', 'update_customer');
                formData.append('customer_id', document.getElementById('updateId').value);
                formData.append('name', document.getElementById('updateName').value);
                formData.append('phone', document.getElementById('updatePhone').value);
                formData.append('email', document.getElementById('updateEmail').value);
                formData.append('address', document.getElementById('updateAddress').value);
                formData.append('date_of_birth', document.getElementById('updateDOB').value);
                
                const response = await fetch(API_BASE_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                displayResult('updateCustomerResult', data, !data.success);
                
            } catch (error) {
                displayResult('updateCustomerResult', `Error: ${error.message}`, true);
            }
        }

        async function testGetCustomerStats() {
            try {
                const params = new URLSearchParams({
                    action: 'get_customer_stats'
                });
                
                const response = await fetch(`${API_BASE_URL}?${params}`);
                const data = await response.json();
                
                displayResult('customerStatsResult', data, !data.success);
                
            } catch (error) {
                displayResult('customerStatsResult', `Error: ${error.message}`, true);
            }
        }

        async function testGetCustomerPurchases() {
            try {
                const customerId = document.getElementById('purchaseCustomerId').value;
                const params = new URLSearchParams({
                    action: 'get_customer_purchases',
                    customer_id: customerId,
                    limit: 5
                });
                
                const response = await fetch(`${API_BASE_URL}?${params}`);
                const data = await response.json();
                
                displayResult('purchaseHistoryResult', data, !data.success);
                
            } catch (error) {
                displayResult('purchaseHistoryResult', `Error: ${error.message}`, true);
            }
        }

        // Load all customers on page load
        window.onload = function() {
            testGetAllCustomers();
            testGetCustomerStats();
        };
    </script>
</body>
</html>
