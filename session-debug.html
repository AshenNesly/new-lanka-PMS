<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Debug - New Lanka Pharmacy</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .debug-box { 
            background: #f5f5f5; 
            border: 1px solid #ddd; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .error { color: red; }
        .success { color: green; }
        pre { background: #000; color: #0f0; padding: 15px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🔧 Session Debug Tool</h1>
    
    <div class="debug-box">
        <h3>Session Test Results</h3>
        <div id="sessionResults">Loading...</div>
    </div>
    
    <div class="debug-box">
        <h3>User Profile API Test</h3>
        <div id="profileResults">Loading...</div>
    </div>
    
    <div class="debug-box">
        <h3>Actions</h3>
        <button onclick="testSession()">🔄 Test Session</button>
        <button onclick="testProfile()">👤 Test Profile API</button>
        <button onclick="clearSession()">🗑️ Clear Session</button>
    </div>

    <script>
        // Test session
        async function testSession() {
            try {
                const response = await fetch('php/session-test.php');
                const data = await response.json();
                document.getElementById('sessionResults').innerHTML = 
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('sessionResults').innerHTML = 
                    '<div class="error">Error: ' + error.message + '</div>';
            }
        }
        
        // Test profile API
        async function testProfile() {
            try {
                const response = await fetch('php/user-profile.php?action=get_current_user');
                const data = await response.json();
                document.getElementById('profileResults').innerHTML = 
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('profileResults').innerHTML = 
                    '<div class="error">Error: ' + error.message + '</div>';
            }
        }
        
        // Clear session
        function clearSession() {
            if (confirm('Clear session and logout?')) {
                window.location.href = 'php/logout.php';
            }
        }
        
        // Auto-run tests
        document.addEventListener('DOMContentLoaded', function() {
            testSession();
            setTimeout(testProfile, 1000);
        });
    </script>
</body>
</html>
