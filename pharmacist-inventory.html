<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Inventory - New Lanka Pharmacy</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/pharmacist-inventory.js" defer></script>
    <script src="js/universal-session-manager.js" defer></script>
</head>
<body>
    <div class="main-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="logo-section">
                <img src="icons/pharmacy-logo.png" alt="New Lanka Pharmacy" class="logo">
                <span class="brand-name">New Lanka</span>
            </div>
            
            <!-- Pharmacist Profile Section -->
            <div class="admin-section">
                <div class="admin-profile-sidebar">
                    <img src="profile.jpg" alt="Pharmacist" class="admin-avatar">
                    <div class="admin-info">
                        <h4>Pharmacist</h4>
                        <span>Pharmacist</span>
                    </div>
                    <div class="admin-menu">
                        <button class="admin-menu-btn" id="adminMenuBtn">⋮</button>
                        <div class="admin-dropdown" id="adminDropdown">
                            <a href="#" class="dropdown-item" id="logoutBtn">
                                <span class="logout-icon">🚪</span>
                                Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="nav-menu">
                <a href="pharmacist-cashier.html" class="nav-item">
                    <img src="icons/casheir.png" alt="Cashier" class="nav-icon">
                    Cashier
                </a>
                <a href="pharmacist-inventory.html" class="nav-item active">
                    <img src="icons/inventory.png" alt="Inventory" class="nav-icon">
                    Inventory
                </a>
                <a href="pharmacist-sales.html" class="nav-item">
                    <img src="icons/history.png" alt="Sales History" class="nav-icon">
                    Sales History
                </a>
                <a href="pharmacist-customers.html" class="nav-item">
                    <img src="icons/customer.png" alt="Customers" class="nav-icon">
                    Customers
                </a>
                <a href="pharmacist-configurations.html" class="nav-item">
                    <img src="icons/setting.png" alt="Configuration" class="nav-icon">
                    Configuration
                </a>
            </div>
            
            <!-- Footer Text -->
            <div class="sidebar-footer">
                <p>Developed by ESoft UNI Bit 004 Project Group 04</p>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title">Inventory</h1>
                </div>
                <div class="header-right">
                    <div class="greeting">
                        <span class="greeting-text">Good Morning</span>
                        <div class="date-time">
                            <span id="currentDate">25 May 2025</span>
                            <span id="currentTime">22:45:04</span>
                        </div>
                    </div>
                </div>
            </header>            <!-- Content Header -->
            <div class="content-header">
            </div>

            <!-- Content Body -->
            <div class="content-body">
                <!-- Statistics Cards -->
                <div class="stats-grid inventory-stats">
                    <div class="stat-card info">
                        <div class="stat-icon icon-medical"></div>
                        <div class="stat-value">298</div>
                        <div class="stat-label">Medicines Available</div>                        <a href="pharmacist-full-med-list.html" class="card-action">
                            View Full List
                            <span class="icon-arrow"></span>
                        </a>
                    </div>

                    <div class="stat-card good">
                        <div class="stat-icon icon-medical"></div>
                        <div class="stat-value">02</div>
                        <div class="stat-label">Medicine Groups</div>                        <a href="pharmacist-med-groups.html" class="card-action">
                            View Groups
                            <span class="icon-arrow"></span>
                        </a>
                    </div>                    <div class="stat-card danger">
                        <div class="stat-icon icon-warning"></div>
                        <div class="stat-value">01</div>
                        <div class="stat-label">Medicine Shortage</div>
                        <a href="pharmacist-med-shortage.html" class="card-action">
                            Resolve Now
                            <span class="icon-arrow"></span>
                        </a>
                    </div></div>
            </div>
        </main>
    </div>
</body>
</html>
