<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - New Lanka Pharmacy</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Branding -->
        <div class="login-left">            <div class="login-branding">
                <div class="logo-section">
                    <img src="icons/pharmacy-logo.png" alt="New Lanka Pharmacy" class="logo">
                    <div class="brand-text">
                        <span class="brand-name">New Lanka Pharmacy</span>
                        <p class="brand-tagline">Empowering Health, Enriching Lives</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Side - Login Form -->
        <div class="login-right">
            <div class="login-card">
                <div class="login-header">
                    <h2>Welcome Back!</h2>
                    <p>Please sign in to your account</p>
                </div>
                
                <!-- Error/Success Messages -->
                <div id="loginMessage" class="message-container" style="display: none;">
                    <div id="messageText" class="message"></div>
                </div>
                
                <form id="loginForm" class="login-form" action="php/login_handler.php" method="POST">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required>
                        <span class="error-message" id="usernameError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                        <span class="error-message" id="passwordError"></span>
                    </div>
                    
                    <button type="submit" class="btn btn-primary login-btn" id="loginButton">
                        <span class="button-text">Sign In</span>
                        <div class="loading-spinner" style="display: none;">
                            <div class="spinner"></div>
                        </div>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/index.js" defer></script>
